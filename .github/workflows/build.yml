name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Windows MSVC Debug",       os: windows-latest, preset: msvc-debug }
          # headers: true = also run the header self-containment check (every
          # src/**/*.hpp compiled on its own). One job per compiler is enough:
          # the check does not depend on Debug/Release or on sanitizers, but
          # MSVC and GCC pull in different standard headers transitively, so
          # each compiler can catch a missing #include the other one misses.
          - { name: "Windows MSVC Release",     os: windows-latest, preset: msvc-release, headers: true }
          - { name: "Linux GCC Debug",          os: ubuntu-latest,  preset: gcc-debug }
          - { name: "Linux GCC Release",        os: ubuntu-latest,  preset: gcc-release,  headers: true }
          - { name: "Linux GCC Debug + ASan",   os: ubuntu-latest,  preset: gcc-debug-asan }

    steps:
      - uses: actions/checkout@v4

      # The presets use cl.exe with Ninja, so the MSVC environment must be
      # loaded into the shell first.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config g++-14 gcc-14 \
            libwayland-dev libcairo2-dev libpango1.0-dev \
            libegl1-mesa-dev libgles2-mesa-dev libxkbcommon-dev \
            libpng-dev libjpeg-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Fails when a header uses something it does not #include itself (it only
      # compiled before because main.cpp happened to include that thing first).
      # The target is EXCLUDE_FROM_ALL, so the Build step above skips it.
      - name: Header self-containment check
        if: matrix.headers
        run: cmake --build --preset ${{ matrix.preset }} --target header_check --parallel

      # literoom_golden_render is skipped (exit code 77) when there is no golden
      # file for the compiler/config (e.g. GNU Release), so it never fails here.
      # -LE headers: the header check has its own step above (and only runs on
      # two jobs), so ctest must not build it again on every job.
      - name: Test
        run: ctest --preset ${{ matrix.preset }} -LE headers